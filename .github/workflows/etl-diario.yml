name: ETL diario Kreems (nube)

# Corre el ETL de Gran Natural (ventas Obuma + pedidos Autoventa) en los
# servidores de GitHub, SIN depender del PC de la oficina. Así los datos quedan
# frescos temprano en la mañana para el reporte de las 9 AM.
#
# Horarios (GitHub usa UTC; Chile = UTC-4 en invierno / UTC-3 en verano):
#   08:37 UTC -> 04:37 (invierno) / 05:37 (verano) Chile   <- corrida principal
#   10:23 UTC -> 06:23 (invierno) / 07:23 (verano) Chile   <- respaldo
#
# DOS reglas al elegir la hora (aprendidas midiendo 25 días de corridas reales,
# 2026-08-28):
#
# 1. NUNCA en el minuto :00. El cron de GitHub es "best effort" y el minuto en
#    punto es su hora peak: con "0 10 * * *" NINGUNA corrida arrancó a tiempo —
#    el atraso típico fue de 14 a 60 min, con picos de 118 min, un día disparó
#    10 h tarde (20:03 UTC) y otro no disparó nunca. Con minutos "raros" el
#    scheduler está mucho menos congestionado.
#
# 2. DOS corridas separadas ~2 h. No es por el atraso (eso se absorbe con
#    holgura), sino porque GitHub a veces se salta el disparo entero y ese día
#    hay que correrlo a mano. Dos intentos independientes cubren ese caso.
#    Cabe en la cuota: tras cachear las consultas repetidas cada corrida gasta
#    5 consultas de `clientes.list` de un tope de ~20 al día, así que 2 corridas
#    (10) todavía dejan margen para 2 re-runs manuales. Ver ObumaCuotaError en
#    etl/loaders/obuma_api.py.
#
# El ETL es idempotente: que corran las dos NO duplica nada, y si un día se
# saltan ambas, la corrida siguiente recarga el mes completo.
# Para recuperar en el momento: Actions -> "Run workflow".
#
# Requiere estos Secrets del repo (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OBUMA_API_KEY, AUTOVENTA_API_KEY_ADMIN
#   (AUTOVENTA_EMPRESA_ID es opcional; por defecto 548)

on:
  schedule:
    - cron: "37 8 * * *"    # principal
    - cron: "23 10 * * *"   # respaldo, por si GitHub se salta la primera
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestaña "Actions"

concurrency:
  group: etl-diario
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del ETL
        run: |
          python -m pip install --upgrade pip
          pip install pandas "supabase==2.7.4" python-dotenv python-dateutil openpyxl lxml

      - name: Verificar que los secrets estén configurados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OBUMA_API_KEY: ${{ secrets.OBUMA_API_KEY }}
          AUTOVENTA_API_KEY_ADMIN: ${{ secrets.AUTOVENTA_API_KEY_ADMIN }}
        run: |
          faltan=""
          for s in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY OBUMA_API_KEY AUTOVENTA_API_KEY_ADMIN; do
            if [ -z "${!s}" ]; then faltan="$faltan $s"; fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan estos secrets (créalos en Settings > Secrets and variables > Actions > Secrets):$faltan"
            exit 1
          fi
          echo "OK: los 4 secrets están configurados."

      - name: Ejecutar carga diaria (Obuma + Autoventa Gran Natural)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OBUMA_API_KEY: ${{ secrets.OBUMA_API_KEY }}
          AUTOVENTA_API_KEY_ADMIN: ${{ secrets.AUTOVENTA_API_KEY_ADMIN }}
          AUTOVENTA_EMPRESA_ID: ${{ secrets.AUTOVENTA_EMPRESA_ID || '548' }}
        run: python -m etl.run_diario

      - name: Guardar el log como artifact (para revisar si algo falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl_auto-log
          path: etl_auto.log
          if-no-files-found: ignore
          retention-days: 14
