name: ETL diario Kreems (nube)

# Corre el ETL de Gran Natural (ventas Obuma + pedidos Autoventa) en los
# servidores de GitHub, SIN depender del PC de la oficina. Así los datos quedan
# frescos temprano en la mañana para el reporte de las 9 AM.
#
# Horario (GitHub usa UTC; Chile = UTC-4 en invierno / UTC-3 en verano):
#   10:00 UTC -> 06:00 (invierno) / 07:00 (verano) Chile
# Deja ~3 h de holgura antes del reporte de las 9 AM, de sobra para absorber los
# retrasos habituales del cron de GitHub.
#
# UNA sola corrida diaria (2026-08-03). Antes eran dos (10:00 y 11:00 UTC) "por
# redundancia", pero la cuota diaria de la API de Obuma es POR MÉTODO y es baja:
# cada corrida gasta 5 consultas de `clientes.list` y la segunda dejaba el día sin
# margen para un re-run manual (Error 005, ver etl/loaders/obuma_api.py).
# La redundancia no hacía falta: un cron retrasado igual carga los datos, y si
# GitHub llegara a saltarse un día, la corrida siguiente recarga el mes completo
# (el ETL es idempotente). Para recuperar en el momento: Actions -> "Run workflow".
#
# Requiere estos Secrets del repo (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OBUMA_API_KEY, AUTOVENTA_API_KEY_ADMIN
#   (AUTOVENTA_EMPRESA_ID es opcional; por defecto 548)

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestaña "Actions"

concurrency:
  group: etl-diario
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del ETL
        run: |
          python -m pip install --upgrade pip
          pip install pandas "supabase==2.7.4" python-dotenv python-dateutil openpyxl lxml

      - name: Verificar que los secrets estén configurados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OBUMA_API_KEY: ${{ secrets.OBUMA_API_KEY }}
          AUTOVENTA_API_KEY_ADMIN: ${{ secrets.AUTOVENTA_API_KEY_ADMIN }}
        run: |
          faltan=""
          for s in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY OBUMA_API_KEY AUTOVENTA_API_KEY_ADMIN; do
            if [ -z "${!s}" ]; then faltan="$faltan $s"; fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan estos secrets (créalos en Settings > Secrets and variables > Actions > Secrets):$faltan"
            exit 1
          fi
          echo "OK: los 4 secrets están configurados."

      - name: Ejecutar carga diaria (Obuma + Autoventa Gran Natural)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OBUMA_API_KEY: ${{ secrets.OBUMA_API_KEY }}
          AUTOVENTA_API_KEY_ADMIN: ${{ secrets.AUTOVENTA_API_KEY_ADMIN }}
          AUTOVENTA_EMPRESA_ID: ${{ secrets.AUTOVENTA_EMPRESA_ID || '548' }}
        run: python -m etl.run_diario

      - name: Guardar el log como artifact (para revisar si algo falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl_auto-log
          path: etl_auto.log
          if-no-files-found: ignore
          retention-days: 14
